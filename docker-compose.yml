name: esign
services:
  postgres:
    image: postgres:15
    ports: ['127.0.0.1:55432:5432']
    environment:
      POSTGRES_USER: esign
      POSTGRES_PASSWORD: esign
      POSTGRES_DB: esign_dev
    volumes: ['esign_postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U esign -d esign_dev']
      interval: 2s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
volumes:
  esign_postgres:
