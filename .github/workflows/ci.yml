name: Verify esign
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: esign
          POSTGRES_PASSWORD: esign
          POSTGRES_DB: esign_dev
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U esign -d esign_dev" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils libreoffice-writer libreoffice-calc libreoffice-impress
      - run: npm ci
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -r backend/requirements-dev.txt
      - run: npm run lint && npm run type-check && npm run test:unit
      - run: npm run check:openapi && npm run check:independence
      - run: npm run test:backend
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics
          path: |
            test-results/
            playwright-report/
